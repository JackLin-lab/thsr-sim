name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html native-bridge.js www/
      - run: npm install
      - run: npx cap add android
      - name: Lock landscape
        run: |
          sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          grep -n 'screenOrientation' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: thsr-simulator-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
